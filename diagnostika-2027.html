<script id="exam-data" type="application/json">{"title": "Входная диагностика по обществознанию. ОГЭ-2027", "durationMinutes": 180, "text": "Культура не ограничивается памятниками культуры и истории, как не ограничивается научными открытиями и составляющая единое целое с культурой наука.\nНеобходимо не только заботиться о сохранности отдельных произведений искусства, свидетельствах истории или научных открытиях, но и защищать права на их существование, безопасность, доступность как для специалистов, так и для всех интересующихся. Мы должны оберегать всю сферу культуры, свободу культурной (в том числе и научной) информации, отстаивать точность информации о культурных ценностях (повторяю — и научных в равной степени). А разве можно быть безучастным к судьбам культуры малых народов, живущих в окружении народов многочисленных? Особой заботой должны быть окружены архивы, библиотеки, музеи, коллекции, находящиеся во владении государства или отдельных собственников, национальные традиции и обычаи, традиционные религии и т. д.\nНаша обязанность — поддерживать и совершенствовать культурный климат как наиболее благоприятный для сохранения и развития всех форм культуры. Система образования и информации должна быть построена так, чтобы способствовать развитию общечеловеческой культуры и культуры малых народов — их национального лица, их языка и фольклора.\nКультура — она ведь всемирная, не закрытая, а именно открытая эстетическая система. Сколько десятилетий нашу культуру, нашу науку старались отгородить от всего мира «железным занавесом». Но не скрыть их в мире современных коммуникаций. Наша литература, наше искусство обогатили мировую культуру, стали катализатором общественной и духовной жизни.\n(По Д. С. Лихачёву)", "questions": [{"n": 1, "kind": "essay", "stem": "Какие два из перечисленных понятий используются в первую очередь при описании форм политического участия граждан?\nВыборы, уплата налогов, сохранение природы, членство в партии, военная служба.\nВыпишите соответствующие понятия и раскройте смысл любого одного из них.", "options": [], "answer": null, "max": 2, "rubric": "2 балла: выборы и членство в партии, раскрыт смысл любого одного. 1 балл: частично верный ответ согласно критериям ФИПИ. 0: неверно.", "image": null}, {"n": 2, "kind": "short", "stem": "Заполните пропуск в таблице. Государственный символ: флаг — полотнище определённой формы со специальной расцветкой; ______ — торжественная песня, принятая как символ государственного или социального единства.", "options": [], "answer": ["гимн"], "max": 1, "rubric": "", "image": null}, {"n": 3, "kind": "short", "stem": "Константину — 13 лет, Кириллу — 14 лет. Сравните объёмы дееспособности. Запишите сначала номера черт сходства, затем номера черт различия (четыре цифры подряд).\n1) распоряжение своим заработком, стипендией и иными доходами\n2) совершение не требующих нотариального удостоверения сделок, направленных на безвозмездное получение выгоды\n3) совершение мелких бытовых сделок\n4) внесение вкладов в кредитные учреждения и распоряжение ими", "options": [], "answer": ["2314", "3214", "2341", "3241"], "max": 1, "rubric": "", "image": null}, {"n": 4, "kind": "choice", "stem": "Что отличает науку от других форм (областей) духовной культуры?", "options": ["многообразие художественных стилей", "участие в социализации человека", "вера в существование сверхъестественных сил", "получение объективных знаний об окружающем мире"], "answer": ["4"], "max": 1, "rubric": "", "image": null}, {"n": 5, "kind": "choice", "stem": "Родион работает на заводе. Он — хороший отец и друг. Его хобби — футбол: он регулярно посещает футбольные матчи. Обогащая таким образом собственный социальный опыт, Родион развивается как", "options": ["индивид", "личность", "спортсмен", "работник"], "answer": ["2"], "max": 1, "rubric": "", "image": null}, {"n": 6, "kind": "choice", "stem": "Верны ли следующие суждения о социальной мобильности?\nА. Горизонтальная мобильность — это изменение положения, которое приводит к повышению или понижению социального статуса.\nБ. Индивидуальная мобильность всегда связана с вертикальными перемещениями индивида.", "options": ["верно только А", "верно только Б", "верны оба суждения", "оба суждения неверны"], "answer": ["4"], "max": 1, "rubric": "", "image": null}, {"n": 7, "kind": "essay", "stem": "Рассмотрите фотографию. Какая традиционная духовно-нравственная ценность российского общества может быть проиллюстрирована с помощью данной фотографии? Объясните значение этой ценности в социализации новых поколений россиян.", "options": [], "answer": null, "max": 2, "rubric": "2 балла: верно названа ценность (патриотизм) и объяснена её роль в социализации новых поколений. 1: названа ценность, но объяснение отсутствует / некорректно (сверить с критериями).", "image": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAwoAAAIOCAIAAACXvG3UAAAACXBIWXMAAA7EAAAOxAGVKw4bAAlbFUlEQVR4nOy9539VR7L367/mec44jk1OQgEQImcQWRISAoGIEhISOSeTc84555yTAJGTkBDYY4JNsCec8/Leb9Vv78VGEjJmfO7nvhimvWdp7bV7daiu+lV1VfVn/89//v3n33/+/efff/79599//v3n33/+Rfz77Ntv/lr1uypxsQ26dO2e0istKTm1e4+kbt2TkpJ7paalp/fpR+mV2pubHTt1btmydUJC06ZNm3PRvEXLpk2b8cM6tetU+fa7b776+usvvlL569ffeLVVa1SvWbtm7bp16tbjf3Xq6kIlun508+Yte/RMzug3ICs7Z+TosRMmTZk0ZfqUaTOmzZj1/ay538+aw8XU6d9PmjJt4mTK1PETJ4+bMHn8xCkTJk3ljj/8/bQZM6d/P2v697Mps+bMm79wyaKlyymLl62Yv3DxzNnzKHPmLZy3YPHCxUsXL12xbMXqRUuW548c07Zdh4YN42Nj4hrENYyuH0N7YqJjo+pF0Z36UdH1o+pXr1qdxkfVq1+zeg06WK1q9erVqtM1ynd//ZZvW7duS82Hj544f/HyuQuXVM6evxhc2PX5i3yrB/i8EFG4c/rs+ROnzhw9fvLw0eOUI8dO8HnoyDGK7vDVMcqJU0eOndRXBw4dOXj4KJ/7Dhzas/fArj37d+zau33nnp279/n1nu07d/unXVB27t67a88+PlVWrFo7eOiwFi1bN2pkfaenzEWtGrVqVKsRExM3esz4AweP0OaLlwouXCq4eLmg4Mq1q4XXrxbe0Cf3t+3YNXnqjMFDsoZm5+SPHM31qjXreAWjmjlgUOP4hOxhw9eu37jvwGHu+6TMnzt/4Zx5C5avXE2zrxXeeFz65G8/PXvz9u2vv/329tdfX/78y/MXfPzy6vWb12/49/aNffcrhQu+unP3Pl1es27DwsXLmD5G6VFxCT/gKVVC+e3vf6foupKix4Ly93/8g7e8ePHy6Y+06Lm14P0Kyz9PKfMianj16nVRccmWbTsZDegTQoV0Fy1Ztm7DJoaLT4gQcoXIc4ePyBsxesLEKZAud5YsW7Fx89YFi5ampvVp1qxFo4bxUVH1faXUi4mOady4SZMm  неверны"], "answer": ["3"], "max": 1, "rubric": "", "image": null}, {"n": 11, "kind": "choice", "stem": "В государстве все государственные органы, должностные лица и граждане в своей деятельности подчиняются требованиям закона; существует несколько партий, каждая из которых активно участвует в политической жизни страны. Какой политический режим установился?", "options": ["авторитарный", "демократический", "диктаторский", "тоталитарный"], "answer": ["2"], "max": 1, "rubric": "", "image": null}, {"n": 12, "kind": "essay", "stem": "В ходе социологического опроса гражданам задавали вопрос: «Как Вы думаете, поможет ли использование электронных средств обучения (гаджетов) повысить успеваемость школьников?». Результаты представлены на диаграмме.\nСформулируйте по одному выводу: а) о сходстве и б) о различии в позициях групп опрошенных. Выскажите предположения а) о пользе и б) о вреде использования гаджетов на школьных уроках. Предположения должны быть распространёнными предложениями и содержать объяснение позиции.", "options": [], "answer": null, "max": 4, "rubric": "По 1 баллу за каждый элемент: вывод о сходстве (равные доли «всё зависит от учителей»); вывод о различии (учителя чаще ожидают снижения успеваемости); аргументированное предположение о пользе; аргументированное предположение о вреде. Иные обоснованные варианты допустимы.", "image": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAzgAAAG4CAIAAAAGwdUkAAAACXBIWXMAAA7EAAAOxAGVKw4bAADBZElEQVR4nOydCVwU5f/H1fI2jzSPv6biLWqKluSJVl6Z2qGZpRaQGmoeieEB/tK8fqWkmWdp2mmHR6WpeabmfeKFoCILy3ItsLuw3PD/wvNzGmdnl9ndmT3g83499Zr5zjMzzywr8+Y5yxUCAAAAAACXpJyzCwAAAAAAAMSBqAEAAAAAuCgQNQAAAAAAFwWiBgAAAADgokDUAAAAAABcFIgaAAAAmVmzevWGdeuQkJCsSh/95z+m/5ogagAAAGTmv8uXO7sIALgf69etMw1C1AAAAMgMRA0AG4CoAQAAcAQQNQBsAKIGAADAEUDUALABiBoAAABHAFEDwAYgagAAABwBRA0AG4CoAQAAcAQQNQBsAKIGAADAEUDUALABiBoAAABHAFEDwAYgagAAABwBRA0AG4CoAQAAcATmRC0/P993/PgunTpZSF07d17xyScOLjAArgBEDQAAgCMwJ2q3b99u0axZialzp07mrrxly5b3339/qBleeumlkJCQe/fuKfZkACgIRA0AAIAjMCdq4bduSRG1 ми и элементами статуса обучающегося российской школы. 1 — права; 2 — обязанности. Запишите последовательность пяти цифр (АБВГД).\nА) с учётом возрастных и психофизических особенностей участвовать в общественно полезном труде\nБ) учиться добросовестно, систематически выполнять домашние задания\nВ) учиться в безопасных, достойных условиях\nГ) обучаться по индивидуальному учебному плану в пределах осваиваемой образовательной программы\nД) участвовать в конкурсах, олимпиадах, выставках, смотрах, физкультурных мероприятиях", "options": [], "answer": ["22111"], "max": 2, "rubric": "", "image": null}, {"n": 15, "kind": "choice", "stem": "Переход гражданином дороги в неустановленном месте нарушает нормы права", "options": ["административного", "уголовного", "трудового", "гражданского"], "answer": ["1"], "max": 1, "rubric": "", "image": null}, {"n": 16, "kind": "choice", "stem": "Верны ли следующие суждения об уголовной ответственности несовершеннолетних граждан России?\nА. Несовершеннолетний возраст как смягчающее обстоятельство учитывается в совокупности с другими смягчающими и отягчающими обстоятельствами.\nБ. Одним из видов наказаний, назначаемых несовершеннолетним, являются исправительные работы.", "options": ["верно только А", "верно только Б", "верны оба суждения", "оба суждения неверны"], "answer": ["3"], "max": 1, "rubric": "", "image": null}, {"n": 17, "kind": "essay", "stem": "В одном из субъектов Российской Федерации живёт династия врачей, общий стаж работы которой составляет 357 лет. История этой семьи началась в 1926 году. С тех пор три поколения семьи посвятили свою жизнь медицине. Объясните, в чём ценность трудовых династий для а) их членов и б) общества в целом.", "options": [], "answer": null, "max": 2, "rubric": "По 1 баллу за объяснение ценности для членов семьи и для общества (см. формулировки критериев ФИПИ).", "image": null}, {"n": 18, "kind": "essay", "stem": "Прочитайте текст Д. С. Лихачёва. Составьте план текста. Для этого выделите основные смысловые фрагменты текста и озаглавьте каждый из них.", "options": [], "answer": null, "max": 2, "rubric": "2: выделены все основные смысловые фрагменты с содержательными названиями; 1: более половины / неточности в названиях; 0: неверно.", "image": null}, {"n": 19, "kind": "essay", "stem": "На основе текста Д. С. Лихачёва ответьте: Какие учреждения культуры, по мнению автора, должны быть окружены особой заботой? О какой обязанности пишет автор? Как он формулирует одну из задач системы образования и информации?", "options": [], "answer": null, "max": 2, "rubric": "2: три ответа (архивы, библиотеки, музеи; поддерживать и совершенствовать культурный климат; содействовать развитию общечеловеческой культуры и культуры малых народов). 1: два элемента. 0: один или ни одного.", "image": null}, {"n": 20, "kind": "essay", "stem": "Д. С. Лихачёв отмечает, что «наша литература, наше искусство обогатили мировую культуру». На примере трёх конкретных деятелей культуры (или произведений, достижений) поясните мысль автора (приведите пример и дайте краткий комментарий к нему).", "options": [], "answer": null, "max": 3, "rubric": "3: три пояснённых примера; 2: два пояснённых; 1: один пояснённый; 0: нет пояснённых примеров (см. точные оговорки ФИПИ).", "image": null}]}</script>

function load(){try{let s=JSON.parse(localStorage.getItem(store)||'null');if(s){name=s.name||'';answers=s.answers||{}}}catch(e){}}
function intro(){document.title='Входная диагностика ОГЭ-2027';$('app').innerHTML=`<section class="card"><span class="num">20 заданий · 32 балла</span><h1>Входная диагностика по обществознанию. ОГЭ-2027</h1><p>Вопросы из проекта демонстрационного варианта ФИПИ. Выполните задания в удобном темпе. Ответы сохраняются в этом браузере, пока вы работаете.</p><p class="notice"><b>Как отправить работу:</b> после последнего задания нажмите «Завершить», скачайте файл с ответами и отправьте его преподавателю в Telegram или другом мессенджере.</p><label class="label" for="name">Ваше имя и фамилия</label><input type="text" id="name" value="${esc(name)}" placeholder="Например, Иван Петров" maxlength="120"><div class="actions"><button id="start">${Object.keys(answers).length?'Продолжить':'Начать'}</button>${Object.keys(answers).length?'<button class="secondary" id="reset">Очистить ответы</button>':''}</div><p class="footnote">Без регистрации, таймера и установки программ. Для проверки развёрнутых ответов требуется преподаватель.</p></section>`;$('start').onclick=()=>{name=$('name').value.trim();if(!name){alert('Пожалуйста, введите имя и фамилию.');return;}save();show(0)};if($('reset'))$('reset').onclick=()=>{if(confirm('Удалить все ваши ответы?')){answers={};save();intro()}}}
function update(n,val){answers[n]=val;save();const item=document.querySelector('.nav button[data-n="'+n+'"]');if(item)item.classList.toggle('done',filled(n));const el=$('counter');if(el)el.textContent='Заполнено '+q.filter(x=>filled(x.n)).length+' из 20';}
function show(i){idx=i;let x=q[i];let input=x.kind==='choice'?x.options.map((o,j)=>`<label class="choice"><input type="radio" name="answer" value="${j+1}" ${answers[x.n]===String(j+1)?'checked':''}><span>${j+1}) ${esc(o)}</span></label>`).join(''):x.kind==='short'?`<label class="label" for="answer">Краткий ответ</label><input id="answer" type="text" value="${esc(answers[x.n]||'')}" spellcheck="false" autocomplete="off">`:`<label class="label" for="answer">Развёрнутый ответ</label><textarea id="answer" placeholder="Напишите ответ здесь…">${esc(answers[x.n]||'')}</textarea>`;
$('app').innerHTML=`<section class="card"><div class="progress"><span>Задание <b>${x.n}</b> из 20 · максимум ${x.max} б.</span><span id="counter">Заполнено ${q.filter(y=>filled(y.n)).length} из 20</span></div><div class="nav no-print">${q.map((v,j)=>`<button data-n="${v.n}" class="${j===idx?'active':''} ${filled(v.n)?'done':''}" title="Задание ${v.n}">${v.n}</button>`).join('')}</div><h2>Задание №${x.n}</h2>${x.n>=18?`<details open><summary><b>Текст Д. С. Лихачёва для заданий 18–20</b></summary><div class="source">${esc(data.text)}</div></details>`:''}<div class="stem">${esc(x.stem)}</div>${x.image?`<img class="image" src="${x.image}" alt="Изображение к заданию ${x.n}">`:''}<div style="margin-top:18px">${input}</div><div class="actions"><button class="secondary" id="prev" ${i===0?'disabled':''}>Назад</button><button id="next">${i===19?'К завершению':'Далее'}</button><button class="secondary" id="finish">Завершить работу</button></div></section>`;
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(Number(b.dataset.n)-1));document.querySelectorAll('input[name=answer]').forEach(el=>el.onchange=()=>update(x.n,el.value));let a=$('answer');if(a)a.oninput=()=>update(x.n,a.value);$('prev').onclick=()=>show(i-1);$('next').onclick=()=>i===19?confirmFinish():show(i+1);$('finish').onclick=confirmFinish;window.scrollTo(0,0)}
function confirmFinish(){let missing=q.filter(x=>!filled(x.n)).map(x=>x.n);if(missing.length&&!confirm('Не заполнены задания: '+missing.join(', ')+'. Завершить?'))return;finish()}
function normalize(s){return String(s||'').toLowerCase().replace(/ё/g,'е').replace(/[\s,.;:–—-]/g,'')}
function grades(){let score=0,parts=[];for(let x of q){if(!shortSet.has(x.n))continue;let a=normalize(answers[x.n]);let correct=x.answer||[];let points=correct.some(z=>normalize(z)===a)&&a?x.max:0;
// №14: по проекту критериев допускается частичный балл при одной неверной позиции.
if(x.n===14&&points===0&&/^\d{5}$/.test(a)){let expected=normalize(correct[0]);let n=[...a].filter((v,i)=>v!==expected[i]).length;if(n===1)points=1;}
score+=points;parts.push([x.n,points,x.max]);}return {score,parts}}
function report(){let g=grades();let lines=['ВХОДНАЯ ДИАГНОСТИКА ПО ОБЩЕСТВОЗНАНИЮ. ОГЭ-2027','Ученик: '+name,'','Автоматически проверенная часть: '+g.score+' из 13 баллов','Развёрнутые задания №1, 7, 8, 12, 17, 18, 19, 20 проверяет преподаватель (до 19 баллов).','Максимум за всю работу — 32 балла.','','ОТВЕТЫ:'];for(let x of q){lines.push('','ЗАДАНИЕ №'+x.n+' (максимум '+x.max+' б.)',String(answers[x.n]||'[нет ответа]'))}lines.push('','Проверка кратких ответов: '+g.parts.map(r=>'№'+r[0]+': '+r[1]+'/'+r[2]).join('; '));return lines.join('\n')}
function download(){let file=new Blob(['\ufeff'+report()],{type:'text/plain;charset=utf-8'}),a=document.createElement('a'),url=URL.createObjectURL(file);a.href=url;a.download='ОГЭ-2027_'+name.replace(/[^\p{L}\p{N}-]+/gu,'_')+'_ответы.txt';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
async function copy(){try{await navigator.clipboard.writeText(report());alert('Ответы скопированы. Вставьте их в сообщение преподавателю.')}catch(e){let el=$('exportText');el.classList.remove('hidden');el.value=report();el.select();alert('Выделите текст и скопируйте его вручную.')}}
function finish(){let g=grades();$('app').innerHTML=`<section class="card"><span class="num">Работа завершена</span><h1>Спасибо, ${esc(name)}!</h1><div class="notice"><b>Краткие ответы: ${g.score} из 13 баллов.</b><p style="margin-bottom:0">Развёрнутые задания проверяет преподаватель (ещё до 19 баллов). Общий максимум — 32 балла.</p></div><h2 style="margin-top:25px">Отправьте ответы преподавателю</h2><p><b>1.</b> Нажмите «Скачать ответы».<br><b>2.</b> Прикрепите скачанный TXT-файл в Telegram, WhatsApp или электронном письме преподавателю.</p><div class="actions no-print"><button id="download">Скачать ответы (.txt)</button><button id="copy" class="secondary">Скопировать ответы</button><button id="edit" class="secondary">Вернуться к заданиям</button></div><textarea id="exportText" class="hidden" readonly></textarea><h2 style="margin-top:20px">Ваши ответы</h2>${q.map(x=>`<div class="resultrow"><strong>№${x.n} · максимум ${x.max} б.</strong><div class="result-answer">${esc(answers[x.n]||'—')}</div></div>`).join('')}<p class="footnote">Важное ограничение: сайт без сервера не может автоматически отправить ответы преподавателю. Обязательно отправьте скачанный файл или скопированный текст самостоятельно.</p></section>`;$('download').onclick=download;$('copy').onclick=copy;$('edit').onclick=()=>show(19);window.scrollTo(0,0)}
load();intro();
</script></body></html>
